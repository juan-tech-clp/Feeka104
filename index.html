<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feeka 104 AutoDJ</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <div class="logo">
        <img src="img/logo_feeka_104.png" alt="Feeka 104">
    </div>

    <h2>Pide tu canción</h2>

    <div class="buscador">

        <input
            id="BUSCAR"
            placeholder="🔍 Escribe el nombre de la canción">

        <button id="btnBuscar">
            Buscar
        </button>

    </div>

    <div id="resultados"></div>

    <input
        id="usuario"
        placeholder="Tu nombre">

    <button id="btnEnviar">
        PEDIR CANCIÓN
    </button>

    <div id="mensaje"></div>

    <script src="JS/index.js"></script>

</body>

</html>
