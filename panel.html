<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feeka 104 Panel</title>

    <link rel="stylesheet" href="CSS/panel.css">
</head>

<body>

<div class="contenedor-player">

    <!-- REPRODUCTOR -->
    <div id="player-area">

        <h2>AHORA SONANDO</h2>

        <div id="player"></div>
        <div id="actual" style="display:none;"></div>

    </div>

    <!-- PANEL QR -->
    <div class="lado-derecho">

        <div id="qr-info">

            <img class="logo-panel"
                 src="img/logo_feeka_104.png"
                 alt="Feeka 104">

            <div class="marquee">
                <div class="marquee-text">
                    🎵 ESCANEA EL QR • PIDE TU CANCIÓN • FEEKA 104 AUTODJ • LA MÚSICA DE TU NOCHE • ESCANEA EL QR • PIDE TU CANCIÓN •
                </div>
            </div>

            <img class="qr"
                 src="img/qr_code_panel.png"
                 alt="Código QR">

            <p>📱 Escanea el código QR</p>
            <p>🔎 Busca tu canción favorita</p>
            <p>🎵 Envíala</p>
            <p>🚀 Entrará automáticamente a la cola</p>

        </div>

    </div>

</div>

<h2 class="titulo-cola">⏭ EN ESPERA</h2>

<table>

    <thead>
        <tr>
            <th>Artista</th>
            <th>Canción</th>
            <th>Usuario</th>
            <th>Acción</th>
        </tr>
    </thead>

    <tbody id="lista">
    </tbody>

</table>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="JS/panel.js"></script>

</body>
</html>
